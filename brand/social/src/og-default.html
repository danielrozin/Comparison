<meta charset="utf-8">
<link rel="stylesheet" href="font.css">
<link rel="stylesheet" href="_base.css">
<style>
  /* 1200×630 — the default Open Graph / Twitter card image, referenced by
     ~26 pages that have no comparison-specific card of their own. */
  .glow { width: 900px; height: 900px; top: -430px; left: -160px; }
  .glow.two {
    width: 760px; height: 760px; top: auto; left: auto;
    bottom: -430px; right: -180px;
    background: radial-gradient(circle, rgba(192,132,252,0.38) 0%, rgba(192,132,252,0) 68%);
  }
  .watermark {
    position: absolute; bottom: -130px; right: -50px;
    font-weight: 900; font-size: 400px; line-height: 1;
    letter-spacing: -0.07em; color: rgba(255,255,255,0.07);
  }
  .inner {
    position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 0 90px;
  }
  .lockup { display: flex; align-items: center; gap: 13px; margin-bottom: 26px; }
  .chip { width: 44px; height: 44px; border-radius: 11px; font-size: 18px; }
  .wordmark { font-size: 24px; }
  h1 {
    font-weight: 900; font-size: 92px; line-height: 0.98;
    letter-spacing: -0.045em; color: #fff; margin-bottom: 22px;
  }
  h1 .gradient {
    background: linear-gradient(90deg, #c084fc 0%, #93c5fd 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { font-size: 25px; font-weight: 600; color: rgba(219,234,254,0.92); }
</style>
<div class="stage">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="glow two"></div>
  <div class="watermark">VS</div>
  <div class="inner">
    <div class="lockup"><span class="chip">VS</span><span class="wordmark">aversusb.net</span></div>
    <h1>Compare <span class="gradient">Anything</span></h1>
    <div class="sub">Side-by-side, data-driven, free</div>
  </div>
</div>
