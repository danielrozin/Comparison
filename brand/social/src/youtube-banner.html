<meta charset="utf-8">
<link rel="stylesheet" href="font.css">
<link rel="stylesheet" href="_base.css">
<style>
  /* 2560×1440. YouTube shows the full width only on TV; desktop crops to
     roughly 2560×423 and phones to 1546×423, both centred. Everything that
     must survive lives inside the centred 1546×423 box — the rest is
     atmosphere that gets trimmed. */
  .glow { width: 1800px; height: 1800px; top: -900px; left: -400px; }
  .glow.two {
    width: 1500px; height: 1500px; top: auto; left: auto;
    bottom: -820px; right: -360px;
    background: radial-gradient(circle, rgba(192,132,252,0.34) 0%, rgba(192,132,252,0) 68%);
  }

  .watermark {
    position: absolute;
    top: 50%;
    font-weight: 900;
    font-size: 620px;
    line-height: 1;
    letter-spacing: -0.07em;
    color: rgba(255, 255, 255, 0.06);
    transform: translateY(-50%);
  }
  .watermark.left { left: 120px; }
  .watermark.right { right: 120px; }

  .safe {
    position: relative;
    width: 1546px;
    height: 423px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .lockup { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
  .chip { width: 52px; height: 52px; border-radius: 12px; font-size: 21px; }
  .wordmark { font-size: 27px; }

  h1 {
    font-weight: 900;
    font-size: 116px;
    line-height: 0.98;
    letter-spacing: -0.045em;
    color: #fff;
    margin-bottom: 24px;
  }
  h1 .gradient {
    background: linear-gradient(90deg, #c084fc 0%, #93c5fd 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .promise {
    font-size: 27px;
    font-weight: 600;
    color: rgba(219, 234, 254, 0.94);
    letter-spacing: 0.01em;
  }
</style>

<div class="stage">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="glow two"></div>
  <div class="watermark left">VS</div>
  <div class="watermark right">VS</div>

  <div class="safe">
    <div class="lockup">
      <span class="chip">VS</span>
      <span class="wordmark">aversusb.net</span>
    </div>

    <h1>Compare <span class="gradient">Anything</span></h1>

    <div class="promise">A new head-to-head breakdown, every single day</div>
  </div>
</div>
