<meta charset="utf-8">
<link rel="stylesheet" href="font.css">
<link rel="stylesheet" href="_base.css">
<style>
  /* 1024×1024. Facebook, Instagram and YouTube all mask the avatar to a
     circle, so every mark sits inside the inscribed circle with margin —
     nothing important within ~140px of a corner. */
  .glow { width: 900px; height: 900px; top: -300px; left: -260px; }

  .ring {
    position: absolute;
    inset: 92px;
    border-radius: 50%;
    border: 4px solid rgba(255, 255, 255, 0.22);
  }

  .vs {
    position: relative;
    font-weight: 900;
    font-size: 430px;
    line-height: 1;
    letter-spacing: -0.06em;
    color: #fff;
    text-shadow: 0 12px 40px rgba(15, 23, 42, 0.32);
  }
</style>

<div class="stage">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="ring"></div>
  <span class="vs">VS</span>
</div>
