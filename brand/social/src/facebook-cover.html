<meta charset="utf-8">
<link rel="stylesheet" href="font.css">
<link rel="stylesheet" href="_base.css">
<style>
  /* 1640×624 (2× Facebook's 820×312 desktop slot).
     Mobile crops to a 16:9 window from the centre — roughly the middle
     1109px — and on desktop the page avatar overlaps the lower left.
     So: everything readable is centred, and the lower-left ~360×240 is
     kept free of type. */
  .glow { width: 1100px; height: 1100px; top: -560px; left: -180px; }
  .glow.two {
    width: 900px; height: 900px; top: auto; left: auto;
    bottom: -520px; right: -220px;
    background: radial-gradient(circle, rgba(192,132,252,0.38) 0%, rgba(192,132,252,0) 68%);
  }

  /* Ghosted VS pair, bled off both edges — texture on desktop, cropped away
     on mobile. Sunk below the type baseline so it never sits behind the
     headline the way a centred watermark would. */
  .watermark {
    position: absolute;
    bottom: -150px;
    font-weight: 900;
    font-size: 440px;
    line-height: 1;
    letter-spacing: -0.07em;
    color: rgba(255, 255, 255, 0.07);
  }
  .watermark.left { left: -60px; }
  .watermark.right { right: -60px; }

  .safe {
    position: relative;
    width: 1109px;          /* the mobile-visible centre window */
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding-bottom: 26px;   /* nudge up, clear of the avatar overlap */
  }

  .lockup { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .chip { width: 46px; height: 46px; border-radius: 11px; font-size: 19px; }
  .wordmark { font-size: 25px; }

  h1 {
    font-weight: 900;
    font-size: 104px;
    line-height: 0.98;
    letter-spacing: -0.045em;
    color: #fff;
    margin-bottom: 22px;
  }
  h1 .gradient {
    background: linear-gradient(90deg, #c084fc 0%, #93c5fd 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .categories {
    display: flex;
    align-items: center;
    gap: 13px;
    font-size: 23px;
    font-weight: 600;
    color: rgba(219, 234, 254, 0.92);
    letter-spacing: 0.005em;
  }
  .categories .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: rgba(192, 132, 252, 0.85);
  }
</style>

<div class="stage">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="glow two"></div>
  <div class="watermark left">VS</div>
  <div class="watermark right">VS</div>

  <div class="safe">
    <div class="lockup">
      <span class="chip">VS</span>
      <span class="wordmark">aversusb.net</span>
    </div>

    <h1>Compare <span class="gradient">Anything</span></h1>

    <div class="categories">
      <span>Tech</span><span class="dot"></span>
      <span>Products</span><span class="dot"></span>
      <span>Sports</span><span class="dot"></span>
      <span>Countries</span><span class="dot"></span>
      <span>Software</span><span class="dot"></span>
      <span>Health</span>
    </div>
  </div>
</div>
