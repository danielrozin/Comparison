name: Daily Video Pipeline

# Produces V3 "Head to Head" comparison videos: Wikimedia photography, a
# Claude-written script, ElevenLabs narration, a running scoreboard, and the
# data date stamped on every frame. Renders a landscape cut for YouTube and the
# on-page player plus a vertical cut for Shorts, then uploads and commits the
# web assets.
#
# The DAN-1198 gate that forced every scheduled run to --dry-run is gone: it
# existed because renders were silent without ELEVENLABS_API_KEY, and that
# secret is now set. The pipeline itself refuses to produce a silent video, so
# the guarantee is enforced where it belongs rather than by disabling uploads.

on:
  schedule:
    # 08:00 Jerusalem (IDT = UTC+3)
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many videos to produce"
        required: false
        default: "3"
      slugs:
        description: "Explicit slugs (space or comma separated). Overrides count."
        required: false
        default: ""
      mode:
        description: "new = pages with no video; backfill = replace pre-V3 videos"
        required: false
        default: "new"
        type: choice
        options: ["new", "backfill"]
      privacy:
        description: "YouTube privacy for this run"
        required: false
        default: "public"
        type: choice
        options: ["public", "unlisted", "private"]
      dry_run:
        description: "Render only, no upload"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  # Two runs would fight over video-uploads.json and the same git branch.
  group: daily-videos
  cancel-in-progress: false

jobs:
  check-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ok: ${{ steps.probe.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm install --no-audit --no-fund
      - name: Probe YouTube credentials
        id: probe
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          # Cheap read-only call. A dead refresh token is worth discovering in
          # 30 seconds rather than after an hour of rendering.
          if node scripts/daily-video-pipeline-v3.mjs --check-auth; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::YouTube auth failed — the run will render but not upload."
          fi

  produce:
    needs: check-auth
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install ffmpeg and Chromium libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 fonts-liberation \
            libappindicator3-1 libnspr4 xdg-utils

      - run: npm install --no-audit --no-fund

      - name: Produce videos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          HIGGSFIELD_API_KEY_ID: ${{ secrets.HIGGSFIELD_API_KEY_ID }}
          HIGGSFIELD_API_KEY_SECRET: ${{ secrets.HIGGSFIELD_API_KEY_SECRET }}
        run: |
          COUNT="${{ github.event.inputs.count || '3' }}"
          SLUGS="$(echo "${{ github.event.inputs.slugs }}" | tr ',' ' ')"
          PRIVACY="${{ github.event.inputs.privacy || 'public' }}"

          FLAGS=""
          # Upload only when auth actually passed; otherwise fall back to a
          # render-only run rather than failing the whole job.
          if [ "${{ needs.check-auth.outputs.ok }}" != "true" ] || \
             [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
            echo "::notice::Running render-only (no upload)."
          fi
          if [ "${{ github.event.inputs.mode }}" = "backfill" ]; then
            FLAGS="$FLAGS --backfill"
          fi

          if [ -n "$SLUGS" ]; then
            FAILED=""
            for s in $SLUGS; do
              echo "::group::$s"
              node scripts/daily-video-pipeline-v3.mjs --slug "$s" --privacy "$PRIVACY" $FLAGS \
                || FAILED="$FAILED $s"
              echo "::endgroup::"
            done
            [ -n "$FAILED" ] && echo "::warning::Failed:$FAILED"
          else
            node scripts/daily-video-pipeline-v3.mjs --count "$COUNT" --privacy "$PRIVACY" $FLAGS
          fi

      - name: Commit video assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Web-sized page assets and the upload log only. Masters under
          # "Videos For Website/" and the downloaded source photography in
          # public/video-assets/ are gitignored.
          git add src/data/video-uploads.json public/videos remotion/v3/data || true
          if git diff --staged --quiet; then
            echo "Nothing new to commit"
          else
            git commit -m "chore(video): daily V3 videos $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          fi

      - name: Upload masters as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-masters
          path: Videos For Website/v3/*.mp4
          retention-days: 7
          if-no-files-found: ignore
